<!doctype html>
<html lang="zh-Hans">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
        <title>Lines</title>
        <!-- 在 React 载入前先套用主题，避免深色模式闪一下白底（key 与 ThemeProvider 相同） -->
        <script>
            try {
                const stored = localStorage.getItem('lines-theme')
                const dark = stored
                    ? stored === 'dark'
                    : matchMedia('(prefers-color-scheme: dark)').matches
                document.documentElement.classList.toggle('dark', dark)
            } catch {}
        </script>
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
